
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube Prime Plus Life</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
.container{
width:90%;
max-width:700px;
background:#111827;
padding:40px;
border-radius:24px;
box-shadow:0 0 30px rgba(0,0,0,.4);
}
h1{
font-size:48px;
margin-bottom:10px;
}
p{
color:#cbd5e1;
}
input{
width:100%;
padding:16px;
border:none;
border-radius:12px;
margin-top:20px;
font-size:18px;
}
button{
margin-top:20px;
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#22d3ee,#3b82f6);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
.result{
margin-top:30px;
padding:20px;
border-radius:16px;
background:#1e293b;
}
.logo{
max-width:280px;
margin-bottom:20px;
}
</style>
</head>
<body>
<div class="container">
<img class="logo" src="https://i.imgur.com/Hv8N1bX.png">
<h1>Clube Prime</h1>
<p>Consulta rápida de membros ativos.</p>

<input id="busca" placeholder="Digite nome ou número do aluno">
<button onclick="consultar()">Consultar</button>

<div class="result" id="resultado">
Aguardando consulta...
</div>
</div>

<script>
const alunos = [
  {numero:"1001", nome:"Bruno Lima", status:"ATIVO"},
  {numero:"1002", nome:"Ana Carolina", status:"ATIVO"},
  {numero:"1003", nome:"Carlos Eduardo", status:"INATIVO"}
];

function consultar(){
  const termo = document.getElementById('busca').value.toLowerCase();
  const aluno = alunos.find(a =>
    a.numero.includes(termo) ||
    a.nome.toLowerCase().includes(termo)
  );

  const resultado = document.getElementById('resultado');

  if(aluno){
    resultado.innerHTML = `
      <h2>${aluno.nome}</h2>
      <p>Número: ${aluno.numero}</p>
      <p>Status: <strong>${aluno.status}</strong></p>
    `;
  } else {
    resultado.innerHTML = "<h2>Nenhum aluno encontrado.</h2>";
  }
}
</script>
</body>
</html>
